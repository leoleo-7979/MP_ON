<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나의 전자명함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #4419B5;
    --purple: #7B57E8;
    --lav: #9B86F2;
    --ink: #2A2140;
    --sub: #7A72A0;
    --paper: #F3F0FF;
    --line: #E4DBFA;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(150deg,#F5F3FF 0%,#EFEAFE 45%,#F7F5FF 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
  }
  @media (max-width: 480px) {
    body { padding: 26px 14px 60px; }
    .wrap { max-width: 100%; }
    .panel { padding: 18px; }
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .deco { text-align: center; font-size: 26px; margin-bottom: 2px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; text-align: center; letter-spacing: -.3px; }
  .sub { color: var(--sub); font-size: 13px; margin: 0 0 28px; text-align: center; }
  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 22px;
    padding: 26px 24px; box-shadow: 0 10px 30px rgba(68,25,181,.16);
  }
  input[type=text] {
    width: 100%; font-size: 16px; padding: 13px 14px;
    border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--paper); color: var(--ink); font-family: inherit; transition: .15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(68,25,181,.15); }
  button.primary {
    width: 100%; margin-top: 10px; font-family: var(--sans);
    font-size: 15.5px; font-weight: 800; padding: 14px;
    border-radius: 16px; border: 0; letter-spacing: .2px;
    background: linear-gradient(135deg,var(--pink),var(--purple)); color: #fff; cursor: pointer;
    box-shadow: 0 8px 18px rgba(91,38,217,.35); transition: transform .12s, box-shadow .12s;
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(91,38,217,.45); }
  button.primary:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
  .status { font-size: 13px; color: #5B4E99; text-align: center; margin-top: 12px; min-height: 18px; white-space: pre-line; word-break: break-word; font-weight: 600; }
  .empty { color: var(--sub); font-size: 13.5px; text-align: center; margin-top: 16px; }

  /* ---- 실제 명함 카드 (회사 기본 디자인 그대로) ---- */
  #cardResult { margin-top: 22px; display: none; }
  .bizcard {
    background: #fff; border: 1px solid #e4e4e4; border-radius: 12px;
    padding: 34px 36px; box-shadow: 0 6px 20px rgba(0,0,0,.08);
    width: 100%; max-width: 580px; margin: 0 auto;
    font-family: 'Quicksand', "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  .bc-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .bc-name { font-size: 22px; font-weight: 700; color: #222; margin: 0 0 8px; }
  .bc-title { display: inline-block; font-size: 13.5px; font-weight: 600; color: #333; border-bottom: 1.5px solid #333; padding-bottom: 3px; }
  .bc-team { margin-top: 16px; font-size: 13.5px; color: #3b6fd6; font-weight: 600; }
  .bc-logo-img { height: 22px; width: auto; display: block; }
  .bc-hr { height: 1.5px; background: #5b6b8c; margin: 26px 0 22px; }
  .bc-contact { }
  .bc-row { display: flex; font-size: 14px; margin-bottom: 9px; font-weight: 600; color: #222; }
  .bc-row .bc-label { flex: 0 0 68px; }
  .bc-row .bc-value { color: #444; font-weight: 500; word-break: keep-all; overflow-wrap: break-word; }
  .bc-address-text { font-size: 13px; color: #555; line-height: 1.6; margin-top: 2px; white-space: pre-line; word-break: keep-all; overflow-wrap: break-word; font-weight: 500; }

  @media (max-width: 480px) {
    .bizcard { max-width: 100%; padding: 24px 22px; }
  }

  .saveBtn {
    width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 16px;
    background: linear-gradient(135deg,var(--pink),var(--purple)); color: #fff; font-weight: 800;
    font-size: 15px; font-family: inherit; letter-spacing: .2px; cursor: pointer;
    box-shadow: 0 8px 18px rgba(91,38,217,.35);
  }
  .saveBtn:disabled { opacity: .6; cursor: default; }
  .saveTip { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .divider-text { text-align: center; font-size: 12px; color: var(--sub); margin: 18px 0 10px; display: flex; align-items: center; gap: 10px; }
  .divider-text::before, .divider-text::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #emailInput { margin-top: 0; }
  .emailBtn { background: linear-gradient(135deg,var(--purple),var(--lav)); box-shadow: 0 8px 18px rgba(91,38,217,.35); }
  .emailStatus { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: 700; white-space: pre-line; }
  .emailStatus.info { color: var(--sub); font-weight: 600; }
  .emailStatus.success { color: #1e9e5a; }
  .emailStatus.error { color: #d64c6c; }

  @media (min-width: 820px) {
    body { padding: 60px 24px; }
    .wrap { max-width: 640px; }
    .deco { font-size: 32px; }
    h1 { font-size: 27px; }
    .sub { font-size: 14.5px; margin-bottom: 34px; }
    .panel { padding: 36px 40px; border-radius: 28px; }
    input[type=text] { font-size: 16px; padding: 15px 16px; }
    button.primary { font-size: 16.5px; padding: 16px; }
  }
</style>
</head>

<div class="wrap">
  <div class="deco">🪪</div>
  <h1>나의 전자명함</h1>
  <p class="sub">본인 전화번호를 입력하면 명함이 자동으로 만들어져요</p>

  <div class="panel">
    <input type="text" id="phoneInput" placeholder="전화번호 입력 (예: 010-1234-5678)" autocomplete="off" inputmode="numeric">
    <button type="button" class="primary" id="searchBtn" onclick="doSearch()">🔍 내 명함 만들기</button>
    <div class="status" id="status"></div>

    <div id="cardResult">
      <div class="bizcard" id="bizcard">
        <div class="bc-header">

  function normalizeDigits(s) {
    return String(s || '').replace(/[^0-9]/g, '');
  }

  function isPhoneLikeQuery(q) {
    var digits = normalizeDigits(q);
    return digits.length >= 4 && digits.length === q.replace(/[\s\-]/g, '').length;
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // (이미 줄바꿈이 되어 있어도 중복으로 빈 줄이 생기지 않도록 처리)
  function formatAddress(addr) {
    var idx = addr.indexOf('(주)');
    if (idx === -1) return addr;
    var before = addr.slice(0, idx).replace(/\s+$/, '');
    var after = addr.slice(idx);
    return before ? before + '\n' + after : after;
  }

  // 참고: 구글이 gviz 응답의 커스텀 responseHandler를 더 이상 반영하지 않고 항상
  // google.visualization.Query.setResponse(...)만 호출하는 것으로 확인되어, 그 기본
  // 콜백을 직접 오버라이드하는 방식으로 변경했습니다.
  function fetchSheet(gid, onDone, onError) {
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};

    var finished = false;
    var scriptEl;

    var timeoutId = setTimeout(function() {
      if (!finished) {
        finished = true;
        cleanup();
        onError(new Error('응답 시간이 초과되었습니다.'));
      }
    }, 12000);

    function cleanup() {
      clearTimeout(timeoutId);
      if (scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
    }

    window.google.visualization.Query.setResponse = function(resp) {
      if (finished) return;
      finished = true;
      cleanup();
      try {
        if (!resp || resp.status === 'error') {
          var msg = (resp && resp.errors && resp.errors[0] && resp.errors[0].detailed_message) || '시트 응답 오류';
          throw new Error(msg);
        }
        var table = resp.table;
        var rows = [];
        for (var r = 0; r < table.rows.length; r++) {
          var cells = table.rows[r].c;
          var rowArr = [];
          for (var c = 0; c < cells.length; c++) {
            var cell = cells[c];
            if (!cell) { rowArr.push(''); continue; }
            var val = (cell.f !== undefined && cell.f !== null) ? cell.f : cell.v;
            rowArr.push(val === null || val === undefined ? '' : String(val));
          }
          rows.push(rowArr);
        }
        onDone(rows);
      } catch (e) {
        onError(e);
      }
    };

    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
      '/gviz/tq?gid=' + gid + '&headers=0&tqx=out:json';

    scriptEl = document.createElement('script');
    scriptEl.src = url;
    scriptEl.onerror = function() {
      if (finished) return;
      finished = true;
      cleanup();
      onError(new Error('시트를 불러오지 못했습니다. 공유 설정을 확인해주세요.'));
    };
    document.body.appendChild(scriptEl);
  }

  function loadAll(callback, onError) {
    setStatus('내 정보를 확인하는 중입니다...');
    document.getElementById('searchBtn').disabled = true;
    fetchSheet(GID_INFO, function(rows) {
      infoRows = rows.slice(INFO_DATA_START_ROW).filter(function(row) {
        return row[COL_INFO.name] && row[COL_INFO.name].trim().length > 0;
      });
      document.getElementById('searchBtn').disabled = false;
      callback();
    }, function(err) {
      document.getElementById('searchBtn').disabled = false;
      onError(err);
    });
  }

  function findByPhone(rows, query) {
    var digits = normalizeDigits(query);
    var matches = [];
    for (var i = 0; i < rows.length; i++) {
      var phone = normalizeDigits(rows[i][COL_INFO.phone]);
      var phone2 = normalizeDigits(rows[i][COL_INFO.phone2]); // M열: 건수제/프리랜서 연락처
      var matched = (phone && (phone === digits || phone.indexOf(digits) !== -1)) ||
                    (phone2 && (phone2 === digits || phone2.indexOf(digits) !== -1));
      if (matched) matches.push(rows[i]);
    }
    return matches;
  }

  function doSearch() {
    var query = document.getElementById('phoneInput').value.trim();
    document.getElementById('cardResult').style.display = 'none';
    if (!query) { setStatus('전화번호를 입력해주세요.'); return; }
    if (!isPhoneLikeQuery(query)) { setStatus('전화번호 형식으로 입력해주세요. (예: 010-1234-5678)'); return; }

    if (infoRows) {
      setStatus('');
      renderCard(query);
    } else {
      loadAll(
        function(){ setStatus(''); renderCard(query); },
        function(err){ setStatus('오류: ' + err.message); }
      );
    }
  }

  function renderCard(query) {
    var matches = findByPhone(infoRows, query);
    var active = matches.filter(function(r) { return (r[COL_INFO.employmentStatus] || '').trim() !== '퇴사'; });

    if (active.length === 0) {
      if (matches.length > 0) {
        setStatus('해당 전화번호로 재직 중인 기록을 찾을 수 없습니다. (퇴사 처리된 기록만 있습니다)');
      } else {
        setStatus('해당 전화번호를 찾을 수 없습니다. 번호를 다시 확인해주세요.');
      }
      return;
    }

    var info = active[0];
    document.getElementById('bcName').textContent = (info[COL_INFO.name] || '').trim();
    document.getElementById('bcTeam').textContent = info[COL_INFO.team] || '';

    var mobile = info[COL_INFO.phone] || info[COL_INFO.phone2] || '';
    setRow('bcMobileRow', 'bcMobile', mobile);

    var email = info[COL_INFO.email] || '';
    setRow('bcEmailRow', 'bcEmail', email);

    var fax = info[COL_INFO.fax] || '';
    setRow('bcFaxRow', 'bcFax', fax);

    var address = (info[COL_INFO.address] || '').trim();
    if (address) {
      document.getElementById('bcAddressRow').style.display = 'flex';
      document.getElementById('bcAddress').style.display = 'block';
      document.getElementById('bcAddress').textContent = formatAddress(address);
    } else {
      document.getElementById('bcAddressRow').style.display = 'none';
      document.getElementById('bcAddress').style.display = 'none';
    }

    document.getElementById('cardResult').style.display = 'block';
  }

  function setRow(rowId, valueId, val) {
    val = (val || '').trim();
    var row = document.getElementById(rowId);
    var valEl = document.getElementById(valueId);
    if (val) {
      row.style.display = 'flex';
      valEl.textContent = val;
    } else {
      row.style.display = 'none';
    }
  }

  function saveCardImage() {
    var btn = document.getElementById('saveBtn');
    var target = document.getElementById('bizcard');
    if (typeof html2canvas === 'undefined') {
      setStatus('이미지 저장 기능을 불러오지 못했습니다. 네트워크를 확인해주세요.');
      return;
    }
    btn.disabled = true;
    var origText = btn.textContent;
    btn.textContent = '저장 중...';
    html2canvas(target, { scale: 2, backgroundColor: '#ffffff' }).then(function(canvas) {
      canvas.toBlob(function(blob) {
        btn.disabled = false;
        btn.textContent = origText;
        if (!blob) return;
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var name = document.getElementById('bcName').textContent || '명함';
        a.href = url;
        a.download = name + '_전자명함.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      });
    }).catch(function() {
      btn.disabled = false;
      btn.textContent = origText;
      setStatus('이미지 저장 중 오류가 발생했습니다.');
    });
  }

  function isValidEmail(s) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  }

  function setEmailStatus(msg, type) {
    var el = document.getElementById('emailStatus');
    el.textContent = msg || '';
    el.className = 'emailStatus' + (type ? (' ' + type) : '');
  }

  function sendCardEmail() {
    var emailInput = document.getElementById('emailInput');
    var email = emailInput.value.trim();
    if (!email) { setEmailStatus('받는 사람 이메일 주소를 입력해주세요.', 'error'); return; }
    if (!isValidEmail(email)) { setEmailStatus('이메일 주소 형식을 확인해주세요. (예: name@example.com)', 'error'); return; }
    if (typeof html2canvas === 'undefined') {
      setEmailStatus('이미지 생성 기능을 불러오지 못했습니다. 네트워크를 확인해주세요.', 'error');
      return;
    }
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('script.google.com') === -1) {
      setEmailStatus('아직 저장소(Apps Script) 연결이 설정되지 않았습니다.\n관리자에게 문의해주세요.', 'error');
      return;
    }

    var btn = document.getElementById('emailBtn');
    var target = document.getElementById('bizcard');
    btn.disabled = true;
    var origText = btn.textContent;
    btn.textContent = '명함 이미지 생성 중...';
    setEmailStatus('명함 이미지를 생성하는 중입니다...', 'info');

    html2canvas(target, { scale: 2, backgroundColor: '#ffffff' }).then(function(canvas) {
      var dataUrl = canvas.toDataURL('image/png');
      var base64 = dataUrl.split(',')[1];
      var name = document.getElementById('bcName').textContent || '';

      btn.textContent = '전송 중...';
      setEmailStatus('이메일을 보내는 중입니다...', 'info');

      var payload = { type: 'send_card_email', toEmail: email, name: name, imageBase64: base64 };
      fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .then(function(r) { return r.text(); })
        .then(function(text) {
          btn.disabled = false;
          btn.textContent = origText;
          var res = null;
          try { res = JSON.parse(text); } catch (e) { res = null; }
          if (res && res.result === 'success') {
            setEmailStatus('📧 ' + email + ' 주소로 명함을 보냈어요! (발송 완료)', 'success');
          } else if (res && res.result === 'error') {
            setEmailStatus('메일 전송에 실패했습니다. ' + (res.message || '알 수 없는 오류가 발생했습니다.'), 'error');
          } else {
            // 서버 응답을 정상적으로 해석하지 못한 경우입니다. (예: 구글 리다이렉트 응답)
            // 요청 자체는 오류 없이 전달되었으므로, 실패로 단정하지 않고 확인을 안내합니다.
            setEmailStatus('요청은 전송했지만 응답을 확인하지 못했어요.\n상대방 메일함에 도착했는지 확인해주세요.', 'info');
          }
        })
        .catch(function(e) {
          btn.disabled = false;
          btn.textContent = origText;
          setEmailStatus('메일 전송에 실패했습니다. ' + e.message, 'error');
        });
    }).catch(function() {
      btn.disabled = false;
      btn.textContent = origText;
      setEmailStatus('이미지 생성 중 오류가 발생했습니다.', 'error');
    });
  }
</script>
